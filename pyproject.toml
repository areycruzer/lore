[project]
name = "lore"
version = "0.1.0"
description = "Lore: on-prem customer knowledge layer for Singtel account managers, exposed to ChatGPT Enterprise via MCP"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mcp[cli]>=1.20,<2",
  "httpx>=0.27",
  "openai>=1.50",
  "pyyaml>=6",
  "segno>=1.6",
]

[project.scripts]
lore = "lore.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
